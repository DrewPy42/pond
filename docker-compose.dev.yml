# Dev only: `docker compose -f docker-compose.dev.yml up`
services:
  pond-dev:
    build:
      context: .
      dockerfile: deploy/Dockerfile.dev
    environment:
      POND_DATA_DIR: /data
      LOG_LEVEL: debug
    ports:
      - '3210:3210'
      - '5173:5173'
    volumes:
      - .:/workspace
      - /workspace/node_modules
      - pond-dev-data:/data
volumes:
  pond-dev-data:
